components:
  db-maintenance:
    stepConfig:
      install-deviser:
        with:
          values:
            image:
              repository: <YOUR_DEV_IMAGE_REPO> # Point to your dev image registry
              pullPolicy: Always
              tag: "latest"
  events-stack:
    stepConfig:
      install-events-ingester:
        with:
          version: 0.5.3
      install-events-presenter:
        with:
          version: 0.9.3
